name: Update News

on:
  schedule:
    - cron: '59 19 * * *' # 毎日日本時間 朝4時59分 (UTC 19:59)
  workflow_dispatch: # 手動でもすぐ実行できるようにする

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # ★ここで requirements.txt に書かれた部品（feedparserやgoogle-genai等）をインストールします
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run update script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python update_news.py

      - name: Commit and push news.json
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto-update news.json"
          file_pattern: news.json
